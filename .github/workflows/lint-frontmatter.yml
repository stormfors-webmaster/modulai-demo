name: Lint & Test

on:
  pull_request:
    paths:
      - "posts/**/*.md"
      - "tools/**/*.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Run Biome linter
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Validate frontmatter schema
        run: node tools/validate-frontmatter.js

